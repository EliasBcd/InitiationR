- Class: meta
  Course: Initiation à R
  Lesson: Représentations graphiques
  Author: Elias Bouacida
  Type: Standard
  Organization: Université Paris 8
  Version: 2.4.5

- Class: text
  Output: Une des plus grandes forces de R par rapport à d'autres langages de
    programmation est la facilité avec laquelle il est possible de créer des
    graphiques de bonne qualité.
    Nous allons voir dans cette leçon les bases des représentations graphiques
    dans R.
    Nous allons pour ce faire utiliser la librairie ggplot2.
    R contient une librairie graphique intégrée, mais celle-ci est relativement
    moins pratique et moins puissante que ggplot2.

- Class: text
  Output: "Le tidyverse et le jeu de données hdv2003 ont déjà été chargés pour
    vous, sous forme de tibble, dans l'objet d, comme dans les leçons
    précédentes.
    ggplot() a une limitation sur les types de données qu'il prend en entrée :
    elles doivent être sous forme de tableau.
    Le but de cette leçon est de vous introduire différents types de
    représentations graphiques et leurs arguments."

- Class: cmd_question
  Output: Affichez d pour vous rappeler des variables disponibles.
  CorrectAnswer: d
  AnswerTests: omnitest(correctExpr='d')
  Hint: Le nom de l'objet seul suffit à l'afficher.

- Class: cmd_question
  Output: On va maintenant utiliser ggplot() pour afficher les données.
    Avant de l'utiliser, mieux vaut regarder comment l'utiliser.
    Tapez ?ggplot pour afficher l'aide sur ggplot.
  CorrectAnswer: ?ggplot
  AnswerTests: any_of_exprs('?ggplot', 'help(ggplot)')
  Hint: Un point d'interrogation devant le nom de la fonction, comme pour
    l'aide déjà consultée dans une leçon précédente.

- Class: cmd_question
  Output: "Pour dire à ggplot que vous allez utiliser le tableau d, tapez :
    ggplot(d)"
  CorrectAnswer: ggplot(d)
  AnswerTests: omnitest(correctExpr='ggplot(d)')
  Hint: La syntaxe vient d'être donnée dans la consigne.

- Class: text
  Output: Rien ne se passe !
    Il manque en effet à R deux éléments.
    Premièrement, comment nous souhaitons représenter les données ?
    On utilise une géométrie pour cela (famille de commandes geom_xxx).
    Deuxièmement, quelle(s) variable(s) issues des données nous souhaitons représenter ?
    Ces variables sont données par l'argument aes() dans geom_xxx().

- Class: cmd_question
  Output: Le mot-clé essentiel pour spécifier comment est geom_ (géométrie).
    Si on veut par exemple représenter les données sous forme d'histogramme,
    on doit utiliser geom_histogram().
    La syntaxe de ggplot() est telle que nous devons ajouter au graphique l'esthétique.
    Il faut taper ggplot(d) + geom_histogram(aes(x = age)) pour afficher le graphique.
    Essayez.
  CorrectAnswer: ggplot(d) + geom_histogram(aes(x = age))
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_histogram(aes(x = age))')
  Hint: La géométrie et la variable à représenter viennent d'être annoncées
    dans la consigne.

- Class: text
  Output: Remarquez que R a automatiquement donné des noms aux axes.
    Il utilise comme nom le nom des colonnes du tableau quand il y en a une.
    Il a aussi automatiquement créé des échelles avec des beaux nombres ronds sur les axes.

- Class: cmd_question
  Output: Essayez maintenant de représenter le même graphique non pas avec la variable
    age mais avec la variable heures.tv.
  CorrectAnswer: ggplot(d) + geom_histogram(aes(x = heures.tv))
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_histogram(aes(x = heures.tv))')
  Hint: Reprenez la commande précédente, en changeant seulement la variable
    dans aes().

- Class: text
  Output: "R affiche un avertissement signalant les valeurs manquantes
    écartées. Un avertissement n'est pas une erreur : le graphique est
    produit, mais il vous indique combien d'observations ne sont pas
    représentées."

- Class: cmd_question
  Output: "Représentons maintenant un nuage de points, pour croiser deux
    variables quantitatives.
    La géométrie ne sera plus un histogramme, mais des points : geom_histogram
    devient geom_point.
    Il y a 2000 observations et beaucoup se superposent exactement.
    On utilise donc plutôt geom_jitter, qui ajoute un léger décalage
    aléatoire, combiné à l'argument alpha qui règle la transparence.
    Représentez l'âge en x et les heures de télévision en y, avec
    ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15)."
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15)
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15)')
  Hint: La géométrie, les variables et l'argument de transparence viennent
    d'être décrits dans la consigne.

- Class: cmd_question
  Output: Nous allons voir comment changer différents aspects du graphique.
    Si par exemple nous voulons changer les légendes des axes, il faut
    ajouter labs(x = "...", y = "...") à nos commandes précédentes.
    Essayez ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + labs(x = "Âge", y = "Heures de télévision").
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + labs(x = "Âge", y = "Heures de télévision")
  AnswerTests: any_of_exprs('ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + labs(x = "Âge", y = "Heures de télévision")',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + labs(y = "Heures de télévision", x = "Âge")')
  Hint: Reprenez le graphique précédent et ajoutez-lui labs(x = ..., y = ...)
    avec les libellés donnés dans la consigne.

- Class: cmd_question
  Output: On peut modifier certains attributs graphiques d'une geom en utilisant des
    arguments supplémentaires.
    On peut utiliser color pour modifier la couleur, size pour modifier la taille
    et alpha pour modifier la transparence.
    Essayez de taper ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), color = "red", size = 2, alpha = 0.3)
    et observez le résultat.
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), color = "red", size = 2, alpha = 0.3)
  AnswerTests: any_of_exprs('ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), color = "red", size = 2, alpha = 0.3)',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), color = "red", alpha = 0.3, size = 2)',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), size = 2, color = "red", alpha = 0.3)',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), size = 2, alpha = 0.3, color = "red")',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.3, color = "red", size = 2)',
    'ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.3, size = 2, color = "red")')
  Hint: Tapez ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), color = "red", size = 2, alpha = 0.3)
    pour afficher le graphique.

- Class: text
  Output: Un mappage, dans ggplot2, est une mise en relation entre un attribut
    graphique du geom (position, couleur, taille...) et une variable du tableau de données.
    Ces mappages sont passés aux différents geom via la fonction aes() (abbréviation d'aesthetic).
    On a déjà vu les mappages x et y pour un nuage de points.
    Ceux-ci signifient que la position d'un point donné horizontalement (x) et
    verticalement (y) dépend de la valeur des variables passées comme arguments x et y dans aes().

- Class: cmd_question
  Output: Il y en a d'autres, color par exemple permet de faire varier la couleur des
    points automatiquement suivant une troisième variable.
    Essayez de taper ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3)
    et observez le résultat.
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3)
  AnswerTests: omnitest(correctExpr="ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3)")
  Hint: Reprenez le nuage de points précédent, en ajoutant color = sexe à
    l'intérieur de aes().

- Class: text
  Output: Qu'observe-t-on ?
    R a coloré les points suivant le sexe et a automatiquement créé
    la légende correspondante.

- Class: text
  Output: La plupart des arguments utilisés dans aes() peuvent être utilisés en dehors
    de aes() et réciproquement.
    Quand ils sont utilisés dans aes(), il y aura un lien entre l'attribut graphique et
    la variable.
    Quand ils sont utilisés en dehors de aes(), il n'y aura pas de lien entre la variable
    et l'attribut graphique.

- Class: mult_question
  Output: "Si on place color = \"red\" à l'intérieur de aes(), plutôt qu'en
    dehors, que se passe-t-il ?"
  AnswerChoices: R comprend qu'il faut colorer selon une variable qui vaudrait "red" pour tous les individus, et crée une légende absurde;Tous les points deviennent rouges, comme si color était en dehors de aes();R renvoie un message d'erreur
  CorrectAnswer: R comprend qu'il faut colorer selon une variable qui vaudrait "red" pour tous les individus, et crée une légende absurde
  AnswerTests: omnitest(correctVal='R comprend qu\'il faut colorer selon une variable qui vaudrait "red" pour tous les individus, et crée une légende absurde')
  Hint: aes() relie toujours un attribut graphique à une variable. Une chaîne
    de caractères placée dans aes() est traitée comme une variable constante,
    pas comme une couleur fixe. Il n'y a aucun message d'erreur.

- Class: text
  Output: C'est une erreur fréquente et silencieuse. La règle à retenir est
    simple. Si l'attribut dépend d'une variable, il va dans aes(). Si
    l'attribut est le même pour toutes les observations, il va en dehors de
    aes().

- Class: text
  Output: Passons maintenant aux variables qualitatives, comme qualif.
    L'équivalent graphique du tri à plat (count()) vu dans la leçon précédente
    est le diagramme en barres, geom_bar().

- Class: cmd_question
  Output: "Quand les modalités sont longues, comme pour qualif, on les affiche
    en y plutôt qu'en x, pour que le texte reste lisible.
    Essayez ggplot(d) + geom_bar(aes(y = qualif))."
  CorrectAnswer: ggplot(d) + geom_bar(aes(y = qualif))
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_bar(aes(y = qualif))')
  Hint: La géométrie et le mappage voulu viennent d'être décrits dans la
    consigne.

- Class: text
  Output: geom_bar() compte lui-même les effectifs de chaque modalité, y compris
    les valeurs manquantes, qui apparaissent comme une barre à part entière.

- Class: cmd_question
  Output: "Pour comparer une variable quantitative selon les modalités d'une
    variable qualitative, on utilise la boîte à moustaches, geom_boxplot().
    Essayez ggplot(d) + geom_boxplot(aes(x = sexe, y = heures.tv))."
  CorrectAnswer: ggplot(d) + geom_boxplot(aes(x = sexe, y = heures.tv))
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_boxplot(aes(x = sexe, y = heures.tv))')
  Hint: La géométrie et les variables à croiser viennent d'être annoncées
    dans la consigne.

- Class: text
  Output: La boîte représente les premier et troisième quartiles, le trait
    au milieu la médiane, et les points isolés les valeurs atypiques. C'est
    exactement ce que la fonction quantile() calculait dans la leçon
    précédente, mais sous forme visuelle.

- Class: cmd_question
  Output: "facet_wrap() répète un même graphique pour chaque modalité d'une
    variable, ce qui permet de comparer des groupes visuellement.
    Reprenez le nuage de points âge / heures de télévision et découpez-le par
    sexe, avec
    ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + facet_wrap(~ sexe)."
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + facet_wrap(~ sexe)
  AnswerTests: omnitest(correctExpr='ggplot(d) + geom_jitter(aes(x = age, y = heures.tv), alpha = 0.15) + facet_wrap(~ sexe)')
  Hint: Reprenez le nuage de points âge / heures de télévision déjà utilisé,
    et ajoutez-lui facet_wrap(~ sexe).

- Class: text
  Output: un dernier point que nous allons voir sont les scale.
    Les plus couramment utilisés sont scale_x_continuous ou scale_x_discrete,
    qui modifient l'axe des abscisses, et leur équivalent avec y pour modifier
    l'axe des ordonnées.
    Les versions continuous s'utilisent quand la variable représentée est continue.
    Les versions discrete quand la variable est discrète (logique).
    On peut utiliser par exemple comme argument limits=c(min, max) pour modifier
    le minimum et le maximum de l'axe.

- Class: cmd_question
  Output: L'âge est une variable continue.
    On peut vouloir la représenter entre 18 et 100 ans.
    Nous utiliserons donc scale_x_continuous(limits=c(18, 100)) en plus des commandes
    déjà utilisées précédemment pour modifier le graphique en conséquence.
    Essayez.
    N'oubliez pas de garder la couleur pour le sexe.
  CorrectAnswer: ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))
  AnswerTests: any_of_exprs('ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))',
    'ggplot(d) + geom_jitter(aes(x = age, color = sexe, y = heures.tv), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))',
    'ggplot(d) + geom_jitter(aes(y = heures.tv, x = age, color = sexe), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))',
    'ggplot(d) + geom_jitter(aes(y = heures.tv, color = sexe, x = age), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))',
    'ggplot(d) + geom_jitter(aes(color = sexe, x = age, y = heures.tv), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))',
    'ggplot(d) + geom_jitter(aes(color = sexe, y = heures.tv, x = age), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))')
  Hint: Tapez ggplot(d) + geom_jitter(aes(x = age, y = heures.tv, color = sexe), alpha = 0.3) + scale_x_continuous(limits=c(18, 100))
    pour afficher le graphique demandé.

- Class: mult_question
  Output: Souhaitez-vous soumettre votre progression sur Moodle à votre
    enseignant (cela ne fonctionnera que pour les étudiants de l'université
    Paris 8) ?
    Si vous ne le faites pas maintenant, vous pourrez toujours lui envoyer le
    fichier 'Representations_graphiques.txt' qui a été créé plus tard.
  AnswerChoices: Oui;Non
  CorrectAnswer: "Oui"
  AnswerTests: submit_log()
  Hint: Cela soumettra votre avancée dans le cours.
