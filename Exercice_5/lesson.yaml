- Class: meta
  Course: Initiation à R
  Lesson: Exercice 5
  Author: Elias Bouacida
  Type: Standard
  Organization: Université Paris 8
  Version: 2.4.5

- Class: text
  Output: Exercice 5.1

- Class: text
  Output: Pour les exercices qui suivent, on a chargé les extensions nécessaires
    et les données de l'enquête hdv2003, converties en tibble dans l'objet d,
    comme dans les leçons précédentes.

- Class: cmd_question
  Output: Faites un nuage de points croisant l'âge (age) et le nombre d'heures
    de télévision quotidien (heures.tv).
  CorrectAnswer: ggplot(d) + geom_point(aes(x = age, y = heures.tv))
  AnswerTests: any_of_exprs('ggplot(d) + geom_point(aes(x = age, y = heures.tv))', 'ggplot(d) + geom_point(aes(age, heures.tv))', 'ggplot(d) + geom_point(aes(y = heures.tv, x = age))')
  Hint: geom_point permet de représenter des nuages de points.
    N'oubliez pas d'indiquer les variables en abscisse et en ordonnée.

- Class: cmd_question
  Output: Faites le même nuage de points, avec les points en rouge et de transparence 0.2.
  CorrectAnswer: ggplot(d) + geom_point(aes(x = age, y = heures.tv), color = "red", alpha = 0.2)
  AnswerTests: any_of_exprs(
    'ggplot(d) + geom_point(aes(x = age, y = heures.tv), color = "red", alpha = 0.2)',
    'ggplot(d) + geom_point(aes(age, heures.tv), color = "red", alpha = 0.2)',
    'ggplot(d) + geom_point(aes(y = heures.tv, x = age), color = "red", alpha = 0.2)',
    'ggplot(d) + geom_point(aes(x = age, y = heures.tv), alpha = 0.2, color = "red")',
    'ggplot(d) + geom_point(aes(age, heures.tv), alpha = 0.2, color = "red")',
    'ggplot(d) + geom_point(aes(y = heures.tv, x = age), alpha = 0.2, color = "red")'
    )
  Hint: geom_point permet de représenter des nuages de points.
    N'oubliez pas d'indiquer les variables en abscisse et en ordonnée.
    La transparence s'obtient à l'aide de la variable alpha.
    La couleur à l'aide de color.

- Class: text
  Output: Exercice 5.2

- Class: cmd_question
  Output: Représentez la répartition du nombre d'heures de télévision (heures.tv)
    selon le niveau d'étude (qualif) sous forme de boîtes à moustaches.
  CorrectAnswer: ggplot(d) + geom_boxplot(aes(x = qualif, y = heures.tv))
  AnswerTests: any_of_exprs('ggplot(d) + geom_boxplot(aes(x = qualif, y = heures.tv))',
    'ggplot(d) + geom_boxplot(aes(y = heures.tv, x = qualif))',
    'ggplot(d) + geom_boxplot(aes(qualif, heures.tv))')
  Hint: geom_boxplot permet de représenter des boîtes à moustache.

- Class: text
  Output: Exercice 5.3

- Class: cmd_question
  Output: Représentez la répartition des enquêtés selon leur niveau d'étude
    (qualif) sous la forme d'un diagramme en bâtons.
  CorrectAnswer: ggplot(d) + geom_bar(aes(x = qualif))
  AnswerTests: any_of_exprs('ggplot(d) + geom_bar(aes(x = qualif))',
    'ggplot(d) + geom_bar(aes(qualif))')
  Hint: geom_bar permet de représenter des diagrammes en bâtons pour des variables sous formes de catégories.

- Class: text
  Output: Exercice 5.4

- Class: cmd_question
  Output: Faites un nuage de points croisant l'âge et le nombre d'heures de
    télévision.
    Faites varier la couleur selon le sexe (sexe).
  CorrectAnswer: ggplot(d) + geom_point(aes(x = age, y = heures.tv, color = sexe))
  AnswerTests: any_of_exprs('ggplot(d) + geom_point(aes(x = age, y = heures.tv, color = sexe))',
    'ggplot(d) + geom_point(aes(age, heures.tv, color = sexe))',
    'ggplot(d) + geom_point(aes(y = heures.tv, x = age, color = sexe))')
  Hint: N'oubliez pas qu'il faut indiquer color dans le mappage pour que la couleur dépende du sexe.

- Class: text
  Output: Très bien, vous avez fini les exercices !

