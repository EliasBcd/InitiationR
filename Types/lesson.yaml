- Class: meta
  Course: Initiation à R
  Lesson: Types
  Author: Elias Bouacida
  Type: Standard
  Organization: Université Paris 8
  Version: 2.4.5

- Class: text
  Output: Nous avons pour l'instant utilisé un seul type de valeurs, les valeurs
    numériques.
    Il en existe en fait d'autres.
    Pour en donner quelques-uns des plus importants, on a dans R les booléens, 
    les chaînes de caractères, les vecteurs et les tableaux.
    Il y en a pleins d'autres.

- Class: cmd_question
  Output: Les booléens sont simples, il y a deux valeurs possibles, TRUE et 
    FALSE (abrégé parfois en T et F).
    Ils nous servirons beaucoup plus tard, pour l'instant, tapez simplement T.
  CorrectAnswer: T
  AnswerTests: omnitest(correctExpr='T')
  Hint: R accepte une abréviation à une seule lettre pour TRUE, mentionnée dans
    la consigne.
  
- Class: cmd_question
  Output: Les booléens sont généralement le résultat d'une comparaison.
    Essayez de taper 3>2
  CorrectAnswer: 3>2
  AnswerTests: omnitest(correctExpr='3>2')
  Hint: Relisez la consigne, l'expression à taper y est donnée telle quelle.
  
- Class: text
  Output: On obtient TRUE !

- Class: mult_question
  Output: "Si on tape 3 < 2, que devrait-on obtenir ?"
  AnswerChoices: TRUE; FALSE
  CorrectAnswer: FALSE
  AnswerTests: omnitest(correctVal="FALSE")
  Hint: Si ce n'est l'un, c'est l'autre !

- Class: cmd_question
  Output: Un autre type de valeur important sont les caractères.
    Les chaînes de caractères sont entre guillemets " ou '.
    Assignez "Chihuahua" à l'objet chien.
  CorrectAnswer: chien <- "Chihuahua"
  AnswerTests: omnitest(correctExpr='chien <- "Chihuahua"')
  Hint: Utilisez l'opérateur d'assignation vu dans la première leçon, et
    n'oubliez pas les guillemets autour du texte.

- Class: cmd_question
  Output: On peut comparer des chaînes de caractères comme des nombres, avec
    l'opérateur d'égalité ==.
    Essayez de savoir si chien est égal à "Doberman".
  CorrectAnswer: chien == "Doberman"
  AnswerTests: any_of_exprs('chien == "Doberman"', '"Doberman" == chien')
  Hint: "L'opérateur d'égalité vient d'être introduit dans la consigne : deux
    signes égal entre les deux valeurs à comparer."

- Class: text
  Output: "Attention : la comparaison s'écrit avec deux signes égal, ==. Un
    seul signe égal, =, ne compare pas, il assigne. C'est l'erreur la plus
    fréquente au début, et R ne vous préviendra pas toujours qu'il y a un
    problème."

- Class: text
  Output: Dans la leçon précédente, nous avons créé un vecteur tailles à l'aide
    de la commande c(), qui signifie 'concatenate' ou 'combine' (assembler en
    anglais).
    Il a été rechargé pour vous au démarrage de cette leçon.
    C'est une collection de valeurs (des nombres).
    Tout objet dans R qui contient une donnée est appelé une structure de donnée.
    Les vecteurs numériques sont les structures de données les plus simple.
    En fait, même un nombre seul est considéré comme un vecteur de longueur 1.

- Class: cmd_question
  Output: Affichez le contenu de tailles pour vérifier que R connaît son existence.
  CorrectAnswer: tailles
  AnswerTests: omnitest(correctExpr='tailles')
  Hint: Il suffit de taper le nom d'un objet pour afficher son contenu.

- Class: cmd_question
  Output: Si vous avez une question sur une commande particulière de R, vous 
    pouvez accéder à l'aide intégrée à R à l'aide de la commande `?` suivi de la
    commande.
    Par exemple, si vous voulez obtenir des informations sur la commande c(), 
    tapez ?c sans les parenthèses.
    Essayez !
  CorrectAnswer: ?c
  AnswerTests: omnitest(correctExpr='?c')
  Hint: Tapez ?c et appuyez sur Entrée. 
    L'aide pour la commande c() s'affichera (en bas à droite dans Rstudio
    normalement)

- Class: cmd_question
  Output: Essayez de construire un vecteur contenant les éléments "R", TRUE et 8 (dans
    cet ordre).
    Nommez-le v.
  CorrectAnswer: v <- c("R", TRUE, 8)
  AnswerTests: omnitest(correctExpr = 'v <- c("R", TRUE, 8)')
  Hint: Utilisez c() pour combiner les trois éléments dans l'ordre demandé, et
    assignez le résultat à v.
  

- Class: cmd_question
  Output: Regardons maintenant ce que contient v.
  CorrectAnswer: v
  AnswerTests: omnitest(correctExpr = 'v')
  Hint: Rappelez-vous qu'il suffit de taper un objet pour l'afficher.

- Class: text
  Output: "Regardez bien le résultat affiché : \"R\" \"TRUE\" \"8\".
    Tout est maintenant entre guillemets, y compris TRUE et 8, qui n'en avaient
    pas quand on les a saisis.
    Rappelez-vous : un vecteur ne peut contenir qu'un seul type de valeurs à la
    fois. Puisque \"R\" est une chaîne de caractères, R a converti TRUE et 8 en
    chaînes de caractères pour pouvoir les mettre dans le même vecteur, sans
    vous prévenir."

- Class: cmd_question
  Output: Pour confirmer ce type de conversion, on peut utiliser la commande
    str(), qui nous renseigne sur la structure d'un objet.
    Essayez-la sur v.
  CorrectAnswer: str(v)
  AnswerTests:  omnitest(correctExpr = 'str(v)')
  Hint: Le nom de la fonction vient d'être donné dans la consigne ; appliquez-la
    à v comme vous l'avez déjà fait pour d'autres fonctions.

- Class: text
  Output: "str(v) confirme ce qu'on avait deviné : chr [1:3] indique un vecteur
    de chaînes de caractères (character) de longueur 3.
    C'est une conversion silencieuse, un peu comme les valeurs manquantes que
    nous reverrons plus tard : R ne renvoie pas d'erreur, il fait un choix à
    votre place. Le réflexe à prendre est de toujours vérifier le type d'un
    vecteur avant de lui faire confiance, avec str() par exemple."

- Class: text
  Output: "Retenez bien les booléens TRUE et FALSE, ainsi que les opérateurs
    de comparaison comme == et <. Vous les retrouverez dès la séance 2 pour
    sélectionner des lignes dans un tableau de données, par exemple avec
    d |> filter(age < 25)."

- Class: mult_question
  Output: Souhaitez-vous soumettre votre progression sur Moodle à votre 
    enseignant (cela ne fonctionnera que pour les étudiants de l'université 
    Paris 8) ?
    Si vous ne le faites pas maintenant, vous pourrez toujours lui envoyer le
    fichier 'Types.txt' qui a été créé plus tard.
  AnswerChoices: Oui;Non
  CorrectAnswer: "Oui"
  AnswerTests: submit_log()
  Hint: Cela soumettra votre avancée dans le cours.
