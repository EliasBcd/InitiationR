- Class: script
  Output: Créer un nouveau script qui effectue les actions suivantes.
    Charger l'extension `questionr`
    Charger le jeu de données nommé `hdv2003`
    Convertir le jeu de données en tibble dans un nouvel objet nommé `d`
    Afficher un aperçu des variables de `d` avec glimpse()
    Tapez enfin submit() pour soumettre votre script.
  AnswerTests: test_exo1()
  Hint: Repensez à toutes les commandes que nous avons vu, vous devez les écrire dans le script.
    Pensez à bien assigner la variables correctement.
  Script: exercice1.R


- Class: text
  Output: Exercice 2.2

- Class: cmd_question
  Output: Grâce aux données précédentes, on souhaite étudier la répartition du
    temps passé devant la télévision par les enquêtés (variable `heures.tv`).
    Pour cela, calculez dans un seul summarise() les principaux indicateurs
    de cette variable (minimum, maximum, moyenne et médiane), en écartant les
    valeurs manquantes.
  CorrectAnswer: d |> summarise(minimum = min(heures.tv, na.rm = TRUE), maximum = max(heures.tv, na.rm = TRUE), moyenne = mean(heures.tv, na.rm = TRUE), mediane = median(heures.tv, na.rm = TRUE))
  AnswerTests: any_of_exprs(
    'd |> summarise(minimum = min(heures.tv, na.rm = TRUE), maximum = max(heures.tv, na.rm = TRUE), moyenne = mean(heures.tv, na.rm = TRUE), mediane = median(heures.tv, na.rm = TRUE))',
    'd |> summarise(moyenne = mean(heures.tv, na.rm = TRUE), mediane = median(heures.tv, na.rm = TRUE), minimum = min(heures.tv, na.rm = TRUE), maximum = max(heures.tv, na.rm = TRUE))'
    )
  Hint: Pensez à la leçon sur la description des données ; quatre appels de
    fonction à l'intérieur d'un seul summarise(), séparés par des virgules.

- Class: cmd_question
  Output: Pouvez-vous donner l'écart-type des heures passées devant la télévision, dans un summarise() ?
  CorrectAnswer: d |> summarise(ecart_type = sd(heures.tv, na.rm = TRUE))
  AnswerTests: omnitest(correctExpr='d |> summarise(ecart_type = sd(heures.tv, na.rm = TRUE))')
  Hint: Quelle fonction permet d'obtenir l'écart-type ?
    Attention, il y a des valeurs manquantes !
    Quel argument faut-il utiliser pour les enlever du calcul ?

- Class: text
  Output: Exercice 2.3

- Class: cmd_question
  Output: On s'intéresse maintenant à l'importance accordée par les enquêtés à leur travail (variable `trav.imp`).
    Faites un tri à plat des effectifs des modalités de cette variable.
  CorrectAnswer: d |> count(trav.imp)
  AnswerTests: omnitest(correctExpr='d |> count(trav.imp)')
  Hint: Quelle fonction du tidyverse permet d'obtenir un tri à plat d'une variable qualitative ?

- Class: cmd_question
  Output: Pouvez-vous dire si l'importance accordée au travail est similaire pour les hommes
    et les femmes ? Croisez trav.imp et sexe avec cette même fonction.
  CorrectAnswer: d |> count(trav.imp, sexe)
  AnswerTests: any_of_exprs('d |> count(trav.imp, sexe)', 'd |> count(sexe, trav.imp)')
  Hint: La même fonction que la question précédente accepte plusieurs
    variables séparées par une virgule.

