- Class: meta
  Course: Initiation à R
  Lesson: Valeurs manquantes
  Author: Elias Bouacida
  Type: Standard
  Organization: Université Paris 8
  Version: 2.4.5

- Class: text
  Output: Les valeurs manquantes jouent un rôle important en statistiques et en
    analyse de données.
    Il arrive qu'elles ne doivent pas être ignorées, mais au contraire étudiées
    avec attention.

- Class: text
  Output: Rappel de la leçon sur les fonctions, où nous avons vu que dans R,
    les valeurs manquantes sont représentées par le code NA (Not Available).
    Dès qu'une valeur d'un calcul est NA, le résultat entier devient NA.

- Class: cmd_question
  Output: Pour vous en rappeler, créez le vecteur c(44, NA, 5, NA), assignez-le
    à x, puis multipliez-le par 3 en une seule commande.
  CorrectAnswer: x <- c(44, NA, 5, NA) * 3
  AnswerTests: any_of_exprs('x <- c(44, NA, 5, NA) * 3', 'x <- 3 * c(44, NA, 5, NA)')
  Hint: NA se tape sans guillemets, comme TRUE ou FALSE ; c'est la même
    propagation que vous avez déjà observée avec mean() dans la leçon sur les
    fonctions.
    
- Class: cmd_question
  Output: Afficher maintenant le résultat.
  CorrectAnswer: x
  AnswerTests: omnitest(correctExpr='x')
  Hint: Rappelez-vous comment afficher un objet.
  
- Class: text
  Output: On va maintenant construire un jeu de données plus consistant, pour
    travailler dans un cas où on ne connaît pas d'avance la position des
    valeurs manquantes.

- Class: cmd_question
  Output: Créons un vecteur de 1000 tirages aléatoires issus d'une loi normale
    centrée réduite, et assignons-le à y.
    La fonction pour tirer des nombres aléatoires selon une loi normale
    s'appelle rnorm, et prend en premier argument le nombre de tirages
    souhaités.
  CorrectAnswer: y <- rnorm(1000)
  AnswerTests: omnitest(correctExpr='y <- rnorm(1000)')
  Hint: rnorm(1000) tire les 1000 valeurs ; n'oubliez pas de les assigner à y.

- Class: cmd_question
  Output: Créons maintenant un second vecteur, z, contenant cette fois 1000 NA.
    La fonction rep() répète une valeur un nombre de fois donné en second
    argument.
  CorrectAnswer: z <- rep(NA, 1000)
  AnswerTests: omnitest(correctExpr='z <- rep(NA, 1000)')
  Hint: rep(NA, 1000) répète NA 1000 fois ; assignez le résultat à z.

- Class: cmd_question
  Output: Enfin, tirons au hasard 100 valeurs parmi l'ensemble formé par y et
    z, afin de ne pas savoir à l'avance combien de valeurs manquantes s'y
    trouvent, ni leur position.
    La fonction sample() tire au hasard, dans le vecteur donné en premier
    argument, le nombre de valeurs donné en second argument.
    Combinez d'abord y et z en un seul vecteur avec c(), puis stockez le
    résultat du tirage dans un objet d.
  CorrectAnswer: d <- sample(c(y, z), 100)
  AnswerTests: omnitest(correctExpr='d <- sample(c(y, z), 100)')
  Hint: sample(c(y, z), 100) tire 100 valeurs parmi y et z réunis ; assignez
    le résultat à d.

- Class: cmd_question
  Output: Commençons par identifier où se trouvent les NA dans d.
    La fonction is.na() indique, pour chaque élément d'un vecteur, s'il est NA
    ou non.
    Utilisez-la sur d et stockez le résultat dans un objet manquantes.
  CorrectAnswer: manquantes <- is.na(d)
  AnswerTests: omnitest(correctExpr='manquantes <- is.na(d)')
  Hint: is.na(d) donne un vecteur de TRUE et FALSE ; assignez-le à
    manquantes.

- Class: cmd_question
  Output: Affichez maintenant manquantes.
  CorrectAnswer: manquantes
  AnswerTests: omnitest(correctExpr='manquantes')
  Hint: Le nom de l'objet seul suffit à l'afficher.

- Class: text
  Output: À chaque fois que vous voyez TRUE, l'élément correspondant dans
    d est un NA.
    À l'inverse, un FALSE correspond à l'un des nombres issus du tirage
    aléatoire.

- Class: cmd_question
  Output: Dans la leçon sur les opérateurs logiques, nous avons vu l'opérateur
    d'égalité ==, qui teste l'égalité entre deux objets.
    On pourrait penser que d == NA donnerait le même résultat que
    is.na(d). Essayez, pour voir si c'est le cas.
  CorrectAnswer: d == NA
  AnswerTests: omnitest(correctExpr='d == NA')
  Hint: Remplacez is.na(d) par une comparaison directe avec ==, comme
    annoncé dans la consigne.

- Class: text
  Output: Le résultat est un vecteur contenant uniquement des NA, ce qui n'a
    rien à voir avec is.na().
    L'explication est simple. NA n'est pas une valeur comme les autres, mais
    un symbole qui indique l'absence de valeur.
    Comparer quelque chose à une absence de valeur ne donne pas de réponse
    franche, et R ne peut que répondre lui-même par une absence de valeur.
    C'est pour cela qu'il existe une fonction dédiée, is.na(), plutôt que
    d'utiliser ==.

- Class: text
  Output: Les NA peuvent être déroutants au début.
    Ne vous inquiétez pas si tout n'est pas parfaitement clair.
    Le point important à retenir est que face à des valeurs manquantes,
    soyez prudent, elles peuvent donner des résultats inattendus si on ne
    les traite pas explicitement.

- Class: text
  Output: Fin de la parenthèse sur ==.
    Nous avons un vecteur, manquantes, qui vaut TRUE pour chaque NA de
    d et FALSE pour chaque nombre.
    Il y a une astuce pour compter rapidement les NA à partir de ce vecteur.

- Class: cmd_question
  Output: R traite les FALSE comme des 0 et les TRUE comme des 1.
    Une fonction déjà utilisée pour additionner les éléments d'un vecteur
    permet donc de compter directement le nombre de TRUE dans manquantes, et
    donc le nombre de NA dans d.
    Utilisez-la sur manquantes.
  CorrectAnswer: sum(manquantes)
  AnswerTests: omnitest(correctExpr='sum(manquantes)')
  Hint: La fonction qui calcule une somme a été vue dans la leçon sur les
    fonctions.

- Class: cmd_question
  Output: Il existe un second type de valeurs manquantes, NaN (de l'anglais
    Not a Number).
    On l'obtient quand un calcul n'a tout simplement pas de résultat
    numérique défini, plutôt que quand une donnée est simplement absente.
    Essayez de diviser 0 par 0 pour en obtenir un.
  CorrectAnswer: 0/0
  AnswerTests: omnitest(correctExpr='0/0')
  Hint: Le résultat demandé s'obtient avec une simple division.

- Class: cmd_question
  Output: R possède aussi un symbole pour l'infini mathématique, Inf.
    Un second cas donne également un NaN. Que se passe-t-il, à votre avis, si
    on soustrait Inf de lui-même ?
  CorrectAnswer: Inf - Inf
  AnswerTests: omnitest(correctExpr='Inf - Inf')
  Hint: Utilisez le symbole Inf des deux côtés d'une soustraction.

- Class: text
  Output: Les NaN sont, vous l'aurez compris, différents des NA.
    Ils n'indiquent pas une absence de valeur en général, mais le fait que le
    résultat d'une opération demandée n'est pas un nombre au sens
    mathématique du terme, et ne peut donc pas être calculé.

- Class: mult_question
  Output: Souhaitez-vous soumettre votre progression sur Moodle à votre
    enseignant (cela ne fonctionnera que pour les étudiants de l'université
    Paris 8) ?
    Si vous ne le faites pas maintenant, vous pourrez toujours lui envoyer le
    fichier 'Valeurs_manquantes.txt' qui a été créé plus tard.
  AnswerChoices: Oui;Non
  CorrectAnswer: "Oui"
  AnswerTests: submit_log()
  Hint: Cela soumettra votre avancée dans le cours.
